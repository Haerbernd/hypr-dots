# Essential Stuff for NVIDIA to work
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = XKB_DEFAULT_LAYOUT,de
env = XKB_DEFAULT_VARIANT,qwertz

env = NVD_BACKEND,direct
 
cursor {
	no_hardware_cursors = true
}

################
### MONITORS ###
################

monitor = DP-1, 2560x1440@75, 1920x0, 1
monitor = DP-3, 1920x1080@75, 0x180, 1
# monitor = HDMI-A-1, 1920x1080@120, 4480x180, 1

################
### PROGRAMS ###
################

$terminal = alacritty
$fileManager = dolphin
$menu = wofi --show drun
$screenshot = make-screenshot.sh

###############
###AUTOSTART###
###############

exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6 # Make dolphin recognize xdg-mime default applications
# exec-once = firefox
exec-once = xwaylandvideobridge
exec-once = discord
exec-once = mullvad-vpn
exec-once = keepassxc
exec-once = qbittorrent
exec-once = systemctl --user start hyprland-session.target
exec-once = kdeconnect-app

exec-shutdown = systemctl --user stop hyprland-session.target

#####################
### LOOK AND FEEL ###
#####################

general {
	gaps_in = 5
	gaps_out = 20

	border_size = 2

	col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
	col.inactive_border = rgba(595959aa)

	# Set to true enable resizing windows by clicking and dragging on borders and gaps
	resize_on_border = true

        layout = dwindle

        # allow_tearing = true # for CS2 to work
}

# windowrulev2 = immediate, class:^(cs2)$

decoration {
	rounding = 10

	active_opacity = 1.0
	inactive_opacity = 1.0

# 	drop_shadow = true
#	shadow_range = 4
#	shadow_render_power = 3
#	col.shadow = rgba(1a1a1aee)

	blur {
		enabled = true
		size = 3
		passes = 1

		vibrancy = 0.1696
	}
}

animations {
	enabled = true

	bezier = myBezier, 0.05, 0.9, 0.1, 1.05

	animation = windows, 1, 7, myBezier
	animation = windowsOut, 1, 7, myBezier
	animation = border, 1, 10, default
	animation = borderangle, 1, 8, default
	animation = fade, 1, 7, default
	animation = workspaces, 1, 6, default
}

dwindle {
	#pseudotile = true
	preserve_split = true
}

# master {
# 	new_status = master
# }

misc {
	force_default_wallpaper = 2
	disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
	kb_layout = de

	numlock_by_default = true

        sensitivity = 0
        accel_profile = flat

        follow_mouse = 1
}

###################
### KEYBINDINGS ###
###################

$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive
bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
#bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen

bind = , PRINT, exec, $screenshot

# Move focus with mainMod + arrow key
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, 1, workspace, 11
bind = $mainMod CTRL, 2, workspace, 12
bind = $mainMod CTRL, 3, workspace, 13
bind = $mainMod CTRL, 4, workspace, 14
bind = $mainMod CTRL, 5, workspace, 15
bind = $mainMod CTRL, 6, workspace, 16
bind = $mainMod CTRL, 7, workspace, 17
bind = $mainMod CTRL, 8, workspace, 18
bind = $mainMod CTRL, 9, workspace, 19
bind = $mainMod CTRL, 0, workspace, 20

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod CTRL SHIFT, 1, movetoworkspace, 11
bind = $mainMod CTRL SHIFT, 2, movetoworkspace, 12
bind = $mainMod CTRL SHIFT, 3, movetoworkspace, 13
bind = $mainMod CTRL SHIFT, 4, movetoworkspace, 14
bind = $mainMod CTRL SHIFT, 5, movetoworkspace, 15
bind = $mainMod CTRL SHIFT, 6, movetoworkspace, 16
bind = $mainMod CTRL SHIFT, 7, movetoworkspace, 17
bind = $mainMod CTRL SHIFT, 8, movetoworkspace, 18
bind = $mainMod CTRL SHIFT, 9, movetoworkspace, 19
bind = $mainMod CTRL SHIFT, 0, movetoworkspace, 20

##############################
### WINDOWS AND WORKSPACES ###
##############################

workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-3
workspace = 3, monitor:DP-3, default:true
workspace = 4, monitor:DP-3
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:HDMI-A-1, default:true
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1
workspace = 11, monitor:DP-1
workspace = 12, monitor:DP-3
workspace = 13, monitor:HDMI-A-1



windowrulev = match:class *, suppress_event maximize

### XWAYLAND ###
# unscale XWayland
xwayland {
  force_zero_scaling = true
}

# toolkit-specific scale
# env = GDK_SCALE,2
env = XCURSOR_SIZE,32

